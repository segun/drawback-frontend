name: Deploy Frontend

on:
  push:
    branches:
      - dev
      - master

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build application
        run: yarn build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy dev via SSH
        if: github.ref_name == 'dev'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_SSH_HOST_DEV }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            node -v
            cd /opt/drawback/frontend
            git fetch origin dev
            git reset --hard origin/dev
            bash deploy/deploy-frontend.sh

      - name: Health check dev
        if: github.ref_name == 'dev'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_SSH_HOST_DEV }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "Waiting for frontend to start..."
            sleep 10
            echo "Running health check..."
            curl -f https://dev.drawback.chat || exit 1
            echo "Frontend is healthy!"

      - name: Deploy master via SSH
        if: github.ref_name == 'master'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_SSH_HOST_PROD }}
          username: ${{ secrets.DO_PROD_USERNAME }}
          key: ${{ secrets.DO_PROD_SSH_KEY }}
          passphrase: ${{ secrets.DO_PROD_SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            node -v
            cd /opt/drawback/frontend
            git fetch origin master
            git reset --hard origin/master
            bash deploy/deploy-frontend.sh

      - name: Health check master
        if: github.ref_name == 'master'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_SSH_HOST_PROD }}
          username: ${{ secrets.DO_PROD_USERNAME }}
          key: ${{ secrets.DO_PROD_SSH_KEY }}
          passphrase: ${{ secrets.DO_PROD_SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "Waiting for frontend to start..."
            sleep 10
            echo "Running health check..."
            curl -f https://drawback.chat || exit 1
            echo "Frontend is healthy!"


