name: Deploy Frontend

on:
  push:
    branches:
      - dev
      - master

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build application
        run: yarn build

  deploy:
    name: Deploy to ${{ matrix.branch }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - branch: dev
            site_host: dev.controlhq.ng
          - branch: master
            site_host: controlhq.ng

    steps:
      - name: Deploy via SSH
        if: github.ref_name == matrix.branch
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.ref_name == 'dev' && secrets.DO_SSH_HOST_DEV || secrets.DO_SSH_HOST_PROD }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          debug: true
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            node -v
            cd /opt/drawback/frontend
            git fetch origin ${{ matrix.branch }}
            git reset --hard origin/${{ matrix.branch }}
            bash deploy/deploy-frontend.sh

      - name: Health Check
        if: github.ref_name == matrix.branch
        run: |
          echo "⏳ Waiting for deployment to complete..."
          sleep 15
          echo "🏥 Running health check..."
          for i in $(seq 1 10); do
            echo "Attempt $i/10..."
            if curl -f --max-time 15 https://${{ matrix.site_host }}; then
              echo "✅ Frontend is healthy!"
              exit 0
            fi
            echo "Not ready yet, retrying in 15s..."
            sleep 15
          done
          echo "❌ Health check failed after 10 attempts."
          exit 1
