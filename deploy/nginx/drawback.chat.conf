server {
    listen 80;
    listen [::]:80;
    server_name drawback.chat www.drawback.chat;

    root /var/www/html;
    index index.html;

    # Security headers (adjust as needed for your deployment stack).
    # Cloudflare Web Analytics requires script access to
    # https://static.cloudflareinsights.com and beacon uploads to
    # https://cloudflareinsights.com.
    # Google Fonts requires stylesheet access to https://fonts.googleapis.com
    # and font file access to https://fonts.gstatic.com.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://cloudflareinsights.com;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Socket.IO — the transport path is always /socket.io/ regardless of namespace.
    # The /drawback namespace is negotiated inside the protocol, not in the URL.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
